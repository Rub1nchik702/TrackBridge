[package]
name = "trackbridge"
version = "1.14.0"
edition = "2024"

[[bin]]
name = "TrackBridge"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
tungstenite = { version = "0.24", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
regex = "1"
unicode-normalization = "0.1"
rand = "0.8"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
rsa = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png","jpeg","ico"] }
rfd = "0.15"
windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_Security_Cryptography","Win32_System_Threading","Win32_Storage_FileSystem","Win32_System_Memory","Win32_Globalization","Win32_Media_Audio","Win32_UI_Shell","Win32_UI_WindowsAndMessaging","Win32_Security"] }

windows = {version="0.58",features=["Win32_Media_MediaFoundation","Win32_System_Com","Win32_Media_Audio"]}
chrono = "0.4"

[build-dependencies]
winresource = "0.1"
