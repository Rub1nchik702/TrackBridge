name: Build Windows
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.ps1'
      - 'assets/TrackBridge.ico'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout published source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile and package Windows application
        shell: powershell
        run: .\build.ps1
      - name: Upload manual-install build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TrackBridge-Windows-${{ github.sha }}
          path: |
            dist/TrackBridge-*-win.zip
            dist/TrackBridge-SHA256SUMS.txt
            dist/TrackBridge-update.json
          if-no-files-found: error
          retention-days: 30
