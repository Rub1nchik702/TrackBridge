name: Build Windows
on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'build.ps1'
      - 'README*.md'
      - 'LICENSE.txt'
      - 'THIRD-PARTY-NOTICES.txt'
      - 'CHANGELOG.md'
      - 'TRADEMARKS.md'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - name: Checkout published source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Compile and package Windows application
        shell: powershell
        run: .\build.ps1
      - name: Test packaged application
        shell: powershell
        run: |
          $archive = Get-Item dist/TrackBridge-*-win.zip
          $testDir = Join-Path $env:RUNNER_TEMP 'TrackBridge-package-test'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $testDir
          $run = Start-Process -FilePath (Join-Path $testDir 'TrackBridge.exe') -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($run.ExitCode -ne 0) { throw 'Packaged application failed its self-test.' }
          Get-Content (Join-Path $testDir 'self-test.txt')
      - name: Upload manual-install build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TrackBridge-Windows-${{ github.sha }}
          path: |
            dist/TrackBridge-*-win.zip
            dist/TrackBridge-SHA256SUMS.txt
            dist/TrackBridge-update.json
          if-no-files-found: error
          retention-days: 30
